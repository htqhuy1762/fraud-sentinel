services:
  postgres:
    image: postgres:16
    container_name: fs-postgres
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fs-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.1.0
    container_name: fs-kafka
    ports:
      - "9092:9092"

volumes:
  pgdata:
