spring:
  application:
    name: scoring-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fraud
    username: fraud
    password: fraud
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

fraud:
  rules:
    high-amount:
      enabled: true
      threshold: 50000000
      score: 60
    night-time:
      enabled: true
      start-hour: 1
      end-hour: 4
      zone: Asia/Ho_Chi_Minh
      score: 20
    velocity:
      enabled: true
      window-seconds: 60
      max-count: 5
      score: 50
  decision:
    review-threshold: 50
    block-threshold: 80