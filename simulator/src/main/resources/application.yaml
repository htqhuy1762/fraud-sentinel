spring:
  application:
    name: simulator
  main:
    keep-alive: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all

simulator:
  topic: transactions.completed
  scoring-url: http://localhost:8081/api/v1/score
  fallback-max-amount: 5000000
  accounts: 1000
  tps: 10
  fraud-rate: 0.02